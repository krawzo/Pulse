name: pulse_flutter
description: Pulse desktop music player with local library and optional Jellyfin.
publish_to: 'none'
version: 0.3.54+73

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  audio_metadata_reader: ^1.8.0
  ffi: ^2.1.4
  win32: ^6.4.0
  media_kit: 1.2.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  media_kit_libs_android_audio: 1.3.8
  media_kit_libs_windows_audio: 1.0.9
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  crypto: ^3.0.6
  share_plus: 13.3.1
  cross_file: ^0.3.5+5
  multicast_dns: 0.3.3+1
  dart_cast: 0.7.4
  window_manager: 0.5.2
  flutter_acrylic: 1.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
